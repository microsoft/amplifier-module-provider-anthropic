[project]
name = "amplifier-module-provider-anthropic"
version = "1.0.0"
description = "Reference provider module - Anthropic Claude integration for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    # Cap below 1.0.0: the SDK's 1.0.0 major removed `temperature` (and other
    # sampling params) from the Messages API, which this module passes into
    # messages.stream()/create(), causing
    # "AsyncMessages.stream() got an unexpected keyword argument 'temperature'".
    # Supporting 1.0.0 requires a separate port; see follow-up.
    "anthropic>=0.96.0,<1.0.0",
]

[project.entry-points."amplifier.modules"]
provider-anthropic = "amplifier_module_provider_anthropic:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_provider_anthropic",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

