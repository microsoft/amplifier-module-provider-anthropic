[project]
name = "amplifier-module-provider-anthropic"
version = "1.0.0"
description = "Reference provider module - Anthropic Claude integration for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    # 1.0.0 removed `temperature`/`top_p`/`top_k` from the typed Messages
    # surface. The API still honors them, so this module now sends its
    # wire-only params (`temperature`, `speed`) via `extra_body` instead of as
    # typed keywords -- a single code path that works on both 0.x and 1.x.
    # Capped below the next major: an unpinned major bump is what broke fresh
    # installs when 1.0.0 shipped.
    "anthropic>=0.96.0,<2.0.0",
]

[project.entry-points."amplifier.modules"]
provider-anthropic = "amplifier_module_provider_anthropic:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_provider_anthropic",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

