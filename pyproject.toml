[project]
name = "amplifier-module-provider-anthropic"
version = "1.0.0"
description = "Reference provider module - Anthropic Claude integration for Amplifier"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    # Requires 1.x. On 0.x, `messages.with_raw_response` returns
    # `LegacyAPIResponse`, whose `parse()` is synchronous; this module awaits it
    # (see the non-streaming path in `_complete_chat_request`), which raises
    # "object Message can't be used in 'await' expression" on every
    # non-streaming call. 1.0.0 returns `AsyncAPIResponse`, whose `parse()` is a
    # coroutine -- the contract this module's code actually targets.
    #
    # 1.0.0 also removed `temperature`/`top_p`/`top_k` from the typed Messages
    # surface; the API still honors them, so they are sent via `extra_body`.
    #
    # Capped below the next major: an unpinned major bump is what broke fresh
    # installs when 1.0.0 shipped.
    "anthropic>=1.0.0,<2.0.0",
]

[project.entry-points."amplifier.modules"]
provider-anthropic = "amplifier_module_provider_anthropic:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_provider_anthropic",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.5",
]

